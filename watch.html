<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumière Chrono</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Montserrat:wght@200;300;400&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #f5f0e8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
      position: relative;
    }

    .leaves { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

    .card {
      position: relative; z-index: 1;
      background: #fff;
      border-radius: 32px;
      padding: 48px 56px 40px;
      display: flex; flex-direction: column; align-items: center; gap: 0;
      box-shadow:
        0 8px 60px rgba(26,58,42,0.18),
        0 2px 12px rgba(0,0,0,0.08),
        0 0 0 1px rgba(201,168,76,0.15);
      min-width: 340px;
    }

    .brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem; font-weight: 300;
      letter-spacing: 0.4em; color: #1a3a2a;
      text-transform: uppercase; margin-bottom: 2px;
    }
    .brand em { color: #c9a84c; font-style: normal; }

    .brand-sub {
      font-size: 0.42rem; letter-spacing: 0.5em;
      color: #8a9a8a; text-transform: uppercase;
      font-weight: 300; margin-bottom: 20px;
    }

    .watch-wrap {
      filter:
        drop-shadow(0 8px 32px rgba(26,58,42,0.35))
        drop-shadow(0 2px 8px rgba(0,0,0,0.2));
    }

    .chrono-display { margin-top: 22px; text-align: center; }
    .chrono-main {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.4rem; font-weight: 300;
      color: #1a3a2a; letter-spacing: 0.05em; line-height: 1;
    }
    .chrono-ms {
      font-size: 0.7rem; font-weight: 200;
      color: #c9a84c; letter-spacing: 0.3em; margin-top: 2px;
    }

    .controls { display: flex; gap: 14px; margin-top: 22px; align-items: center; }

    .btn {
      border: none; cursor: pointer;
      font-family: 'Montserrat', sans-serif; font-weight: 300;
      letter-spacing: 0.2em; text-transform: uppercase;
      transition: all 0.2s; border-radius: 50px;
    }
    .btn:active { transform: scale(0.96); }

    .btn-start {
      padding: 14px 38px; font-size: 0.65rem;
      background: #1a3a2a; color: #f0d878;
      border: 1.5px solid #2d5a3d;
      box-shadow: 0 4px 16px rgba(26,58,42,0.3);
    }
    .btn-start:hover { background: #2d5a3d; }
    .btn-start.running {
      background: #3a1008; color: #f0c0a0;
      border-color: #8a3020;
      box-shadow: 0 4px 16px rgba(138,48,32,0.3);
    }
    .btn-start.running:hover { background: #5a1a10; }

    .btn-lap {
      padding: 12px 22px; font-size: 0.6rem;
      background: transparent; color: #1a3a2a; border: 1px solid #2d5a3d;
    }
    .btn-lap:hover { background: #f0f8f0; }

    .btn-reset {
      padding: 12px 22px; font-size: 0.6rem;
      background: transparent; color: #c9a84c; border: 1px solid #e0d0a0;
    }
    .btn-reset:hover { background: #fdf8ee; }

    .laps {
      margin-top: 18px; width: 100%; max-height: 100px; overflow-y: auto;
      scrollbar-width: thin; scrollbar-color: #2d5a3d transparent;
    }
    .laps::-webkit-scrollbar { width: 3px; }
    .laps::-webkit-scrollbar-thumb { background: #2d5a3d; border-radius: 2px; }

    .lap-item {
      display: flex; justify-content: space-between;
      padding: 5px 4px; border-bottom: 1px solid #f0ece0;
      animation: lapIn 0.25s ease;
    }
    @keyframes lapIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .lap-n  { font-size: 0.5rem; color: #4a8a5a; letter-spacing: 0.2em; }
    .lap-t  { font-family: 'Cormorant Garamond',serif; font-size: 0.9rem; color: #1a3a2a; }
    .lap-d  { font-size: 0.5rem; color: #aaa; letter-spacing: 0.1em; }

    .footer-line {
      margin-top: 18px; font-size: 0.38rem; letter-spacing: 0.45em;
      color: #c0b890; text-transform: uppercase;
      font-family: 'Cormorant Garamond', serif; font-style: italic;
    }
  </style>
</head>
<body>

<svg class="leaves" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <g opacity="0.85">
    <path d="M-60,650 Q80,300 180,100 Q220,200 160,450 Q120,580 20,720 Z" fill="#1a3a2a"/>
    <path d="M80,380 Q130,300 180,100" fill="none" stroke="#2d5a3d" stroke-width="1.2" opacity="0.5"/>
    <path d="M80,380 Q55,430 25,510" fill="none" stroke="#2d5a3d" stroke-width="0.8" opacity="0.4"/>
    <path d="M80,380 Q105,405 115,465" fill="none" stroke="#2d5a3d" stroke-width="0.8" opacity="0.4"/>
    <path d="M130,240 Q100,280 82,330" fill="none" stroke="#3d7050" stroke-width="0.7" opacity="0.3"/>
  </g>
  <g opacity="0.6">
    <path d="M-120,800 Q40,500 120,280 Q170,360 130,560 Q80,700 -20,820 Z" fill="#2d5a3d"/>
    <path d="M50,530 Q80,420 120,280" fill="none" stroke="#4a8a5a" stroke-width="1" opacity="0.4"/>
  </g>
  <g opacity="0.45">
    <path d="M20,120 Q100,75 165,205 Q125,215 82,185 Q42,162 20,120 Z" fill="#1a3a2a"/>
    <path d="M20,120 Q92,152 165,205" fill="none" stroke="#4a8a5a" stroke-width="0.8" opacity="0.4"/>
  </g>
  <g opacity="0.85">
    <path d="M1260,650 Q1120,300 1020,100 Q980,200 1040,450 Q1080,580 1180,720 Z" fill="#1a3a2a"/>
    <path d="M1120,380 Q1070,300 1020,100" fill="none" stroke="#2d5a3d" stroke-width="1.2" opacity="0.5"/>
    <path d="M1120,380 Q1145,430 1175,510" fill="none" stroke="#2d5a3d" stroke-width="0.8" opacity="0.4"/>
    <path d="M1120,380 Q1095,405 1085,465" fill="none" stroke="#2d5a3d" stroke-width="0.8" opacity="0.4"/>
  </g>
  <g opacity="0.6">
    <path d="M1320,800 Q1160,500 1080,280 Q1030,360 1070,560 Q1120,700 1220,820 Z" fill="#2d5a3d"/>
    <path d="M1150,530 Q1120,420 1080,280" fill="none" stroke="#4a8a5a" stroke-width="1" opacity="0.4"/>
  </g>
  <g opacity="0.45">
    <path d="M1180,120 Q1100,75 1035,205 Q1075,215 1118,185 Q1158,162 1180,120 Z" fill="#1a3a2a"/>
    <path d="M1180,120 Q1108,152 1035,205" fill="none" stroke="#4a8a5a" stroke-width="0.8" opacity="0.4"/>
  </g>
  <circle cx="158" cy="215" r="3" fill="#c9a84c" opacity="0.35"/>
  <circle cx="133" cy="172" r="2" fill="#c9a84c" opacity="0.25"/>
  <circle cx="1042" cy="215" r="3" fill="#c9a84c" opacity="0.35"/>
  <circle cx="1067" cy="172" r="2" fill="#c9a84c" opacity="0.25"/>
</svg>

<div class="card">
  <div class="brand">Lumi<em>è</em>re</div>
  <div class="brand-sub">Chrono · Maison de Haute Horlogerie · Genève</div>

  <div class="watch-wrap">
    <svg id="watch" width="260" height="260" viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="caseGrad" cx="38%" cy="32%" r="68%">
          <stop offset="0%" stop-color="#f0d878"/>
          <stop offset="30%" stop-color="#c9a84c"/>
          <stop offset="70%" stop-color="#8a6820"/>
          <stop offset="100%" stop-color="#5a4010"/>
        </radialGradient>
        <radialGradient id="bezelGrad" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#3a6048"/>
          <stop offset="45%" stop-color="#1a3a2a"/>
          <stop offset="100%" stop-color="#0a1810"/>
        </radialGradient>
        <radialGradient id="dialGrad" cx="50%" cy="38%" r="65%">
          <stop offset="0%" stop-color="#0e1a12"/>
          <stop offset="55%" stop-color="#060d08"/>
          <stop offset="100%" stop-color="#020504"/>
        </radialGradient>
        <linearGradient id="handGold" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#f0d878"/>
          <stop offset="50%" stop-color="#c9a84c"/>
          <stop offset="100%" stop-color="#8a6820"/>
        </linearGradient>
        <radialGradient id="dialShine" cx="33%" cy="22%" r="55%">
          <stop offset="0%" stop-color="rgba(74,138,90,0.06)"/>
          <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
        </radialGradient>
        <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f0d878"/>
          <stop offset="100%" stop-color="#7a5a10"/>
        </linearGradient>
        <filter id="greenGlow">
          <feGaussianBlur stdDeviation="2" result="b"/>
          <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.85  0 0 0 0 0.45  0 0 0 0.7 0" result="c"/>
          <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="handShadow">
          <feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-color="rgba(0,0,0,0.7)"/>
        </filter>
        <filter id="goldGlow">
          <feGaussianBlur stdDeviation="1.5" result="b"/>
          <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.9  0 0 0 0 0.7  0 0 0 0 0.2  0 0 0 0.5 0" result="c"/>
          <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <path d="M110,30 Q130,12 150,30 L145,65 Q130,57 115,65 Z" fill="#0a1208" stroke="#c9a84c" stroke-width="0.4"/>
      <path d="M113,32 Q130,15 147,32 L142,60 Q130,53 118,60 Z" fill="#040804" opacity="0.6"/>
      <line x1="121" y1="44" x2="139" y2="44" stroke="#1a3a2a" stroke-width="1.2" stroke-dasharray="2,3"/>
      <line x1="121" y1="50" x2="139" y2="50" stroke="#1a3a2a" stroke-width="1.2" stroke-dasharray="2,3"/>
      <path d="M110,230 Q130,248 150,230 L145,195 Q130,203 115,195 Z" fill="#0a1208" stroke="#c9a84c" stroke-width="0.4"/>
      <path d="M113,228 Q130,245 147,228 L142,200 Q130,207 118,200 Z" fill="#040804" opacity="0.6"/>
      <line x1="121" y1="214" x2="139" y2="214" stroke="#1a3a2a" stroke-width="1.2" stroke-dasharray="2,3"/>
      <line x1="121" y1="220" x2="139" y2="220" stroke="#1a3a2a" stroke-width="1.2" stroke-dasharray="2,3"/>

      <circle cx="130" cy="130" r="106" fill="url(#caseGrad)"/>
      <circle cx="130" cy="130" r="106" fill="none" stroke="#f0d878" stroke-width="0.6" opacity="0.3"/>
      <circle cx="130" cy="130" r="98" fill="url(#bezelGrad)"/>
      <g id="bezelTicks"></g>
      <circle cx="130" cy="130" r="84" fill="url(#dialGrad)"/>
      <circle cx="130" cy="130" r="84" fill="url(#dialShine)"/>
      <circle cx="130" cy="130" r="84" fill="none" stroke="#2d5a3d" stroke-width="0.5" opacity="0.5"/>
      <circle cx="130" cy="130" r="73" fill="none" stroke="#1a3a2a" stroke-width="0.5" opacity="0.4"/>
      <circle cx="130" cy="130" r="72" fill="none" stroke="#4a8a5a" stroke-width="0.3" opacity="0.2"/>

      <g id="hourMarkers"></g>
      <g id="minMarkers"></g>
      <g id="minuteNums"></g>

      <text x="130" y="102" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="8.5" fill="#c9a84c" letter-spacing="3.5" opacity="0.95">LUMIÈRE</text>
      <line x1="112" y1="106" x2="148" y2="106" stroke="#c9a84c" stroke-width="0.4" opacity="0.35"/>
      <text x="130" y="114" text-anchor="middle" font-family="'Montserrat',sans-serif" font-size="4.2" fill="#4a8a5a" letter-spacing="2.5" opacity="0.65">CHRONO</text>

      <g id="secHand" style="transform-origin:130px 130px">
        <line x1="130" y1="145" x2="130" y2="58" stroke="#5cb87a" stroke-width="0.9" stroke-linecap="round" filter="url(#greenGlow)"/>
        <line x1="130" y1="145" x2="130" y2="156" stroke="#2d5a3d" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
        <polygon points="130,54 128.2,62 131.8,62" fill="#7ad090"/>
      </g>
      <g id="minHand" style="transform-origin:130px 130px">
        <rect x="128.8" y="58" width="2.4" height="78" rx="1.2" fill="url(#handGold)" filter="url(#handShadow)"/>
        <polygon points="130,53 127.5,62 132.5,62" fill="#f0d878" opacity="0.95"/>
        <rect x="129.4" y="60" width="1.2" height="8" rx="0.6" fill="rgba(255,255,255,0.5)"/>
      </g>
      <g id="hrHand" style="transform-origin:130px 130px">
        <rect x="127.5" y="72" width="5" height="62" rx="2.5" fill="url(#handGold)" filter="url(#handShadow)"/>
        <polygon points="130,67 126.5,76 133.5,76" fill="#f0d878" opacity="0.9"/>
      </g>

      <circle cx="130" cy="130" r="5.5" fill="url(#caseGrad)"/>
      <circle cx="130" cy="130" r="3.5" fill="#1a3a2a"/>
      <circle cx="130" cy="130" r="2" fill="#4a8a5a" opacity="0.9"/>
      <circle cx="130" cy="130" r="0.8" fill="#7ad090"/>

      <rect x="232" y="124" width="12" height="12" rx="2.5" fill="url(#crownGrad)" stroke="#f0d878" stroke-width="0.4"/>
      <line x1="232" y1="127" x2="244" y2="127" stroke="#5a4010" stroke-width="0.5"/>
      <line x1="232" y1="130" x2="244" y2="130" stroke="#5a4010" stroke-width="0.5"/>
      <line x1="232" y1="133" x2="244" y2="133" stroke="#5a4010" stroke-width="0.5"/>

      <ellipse cx="112" cy="96" rx="33" ry="17" fill="rgba(255,255,255,0.025)" transform="rotate(-28,112,96)"/>
    </svg>
  </div>

  <div class="chrono-display">
    <div class="chrono-main" id="chronoMain">00:00</div>
    <div class="chrono-ms" id="chronoMs">· 00 ·</div>
  </div>

  <div class="controls">
    <button class="btn btn-lap" onclick="lap()">Lap</button>
    <button class="btn btn-start" id="btnStart" onclick="toggle()">Start</button>
    <button class="btn btn-reset" onclick="reset()">Reset</button>
  </div>

  <div class="laps" id="lapList"></div>

  <div class="footer-line">Maison de Haute Horlogerie &nbsp;·&nbsp; Genève &nbsp;·&nbsp; Est. MMXXV</div>
</div>

<script>
  const SVG_NS = "http://www.w3.org/2000/svg";
  const CX = 130, CY = 130;

  function pt(deg, r) {
    const rad = (deg - 90) * Math.PI / 180;
    return [CX + r * Math.cos(rad), CY + r * Math.sin(rad)];
  }

  const bezelG = document.getElementById('bezelTicks');
  for (let i = 0; i < 60; i++) {
    const a = i*6, big = i%5===0;
    const [x1,y1]=pt(a,98), [x2,y2]=pt(a,big?90:93);
    const l=document.createElementNS(SVG_NS,'line');
    l.setAttribute('x1',x1); l.setAttribute('y1',y1);
    l.setAttribute('x2',x2); l.setAttribute('y2',y2);
    l.setAttribute('stroke',big?'#c9a84c':'#2d5a3d');
    l.setAttribute('stroke-width',big?'1.4':'0.7');
    l.setAttribute('opacity',big?'0.9':'0.55');
    bezelG.appendChild(l);
  }

  const hourG = document.getElementById('hourMarkers');
  for (let i=0; i<12; i++) {
    const a=i*30, [bx,by]=pt(a,67);
    if (i===0) {
      const [t1x,t1y]=pt(a-1.8,62),[t2x,t2y]=pt(a+1.8,62),[t3x,t3y]=pt(a,56);
      const tri=document.createElementNS(SVG_NS,'polygon');
      tri.setAttribute('points',`${t1x},${t1y} ${t2x},${t2y} ${t3x},${t3y}`);
      tri.setAttribute('fill','#f0d878'); tri.setAttribute('filter','url(#goldGlow)');
      hourG.appendChild(tri);
    } else if (i%3===0) {
      const r=document.createElementNS(SVG_NS,'rect');
      r.setAttribute('x',bx-3); r.setAttribute('y',by-8);
      r.setAttribute('width','6'); r.setAttribute('height','16'); r.setAttribute('rx','1.5');
      r.setAttribute('fill','url(#handGold)'); r.setAttribute('transform',`rotate(${a},${bx},${by})`);
      r.setAttribute('filter','url(#goldGlow)'); hourG.appendChild(r);
    } else {
      const r=document.createElementNS(SVG_NS,'rect');
      r.setAttribute('x',bx-1.8); r.setAttribute('y',by-6);
      r.setAttribute('width','3.6'); r.setAttribute('height','12'); r.setAttribute('rx','1');
      r.setAttribute('fill','url(#handGold)'); r.setAttribute('transform',`rotate(${a},${bx},${by})`);
      hourG.appendChild(r);
    }
  }

  const minG = document.getElementById('minMarkers');
  for (let i=0; i<60; i++) {
    if (i%5===0) continue;
    const a=i*6, [x1,y1]=pt(a,82), [x2,y2]=pt(a,85);
    const l=document.createElementNS(SVG_NS,'line');
    l.setAttribute('x1',x1); l.setAttribute('y1',y1);
    l.setAttribute('x2',x2); l.setAttribute('y2',y2);
    l.setAttribute('stroke','#2d5a3d'); l.setAttribute('stroke-width','0.7'); l.setAttribute('opacity','0.55');
    minG.appendChild(l);
  }

  const numG = document.getElementById('minuteNums');
  [5,10,15,20,25,30,35,40,45,50,55,60].forEach((n,i)=>{
    const a=(i+1)*30, [tx,ty]=pt(a,57);
    const t=document.createElementNS(SVG_NS,'text');
    t.setAttribute('x',tx); t.setAttribute('y',ty+3);
    t.setAttribute('text-anchor','middle');
    t.setAttribute('font-family',"'Montserrat',sans-serif");
    t.setAttribute('font-size',n%15===0?'6.5':'5');
    t.setAttribute('fill',n%15===0?'#c9a84c':'#4a8a5a');
    t.setAttribute('opacity',n%15===0?'0.9':'0.5');
    t.setAttribute('font-weight','200');
    t.textContent=n;
    numG.appendChild(t);
  });

  let running=false, startTime=0, elapsed=0, laps=[], lapStart=0, rafId=null;

  function pad2(n){ return String(n).padStart(2,'0'); }

  function fmt(ms){
    return {
      main: `${pad2(Math.floor(ms/60000))}:${pad2(Math.floor(ms/1000)%60)}`,
      cs: pad2(Math.floor((ms%1000)/10))
    };
  }

  function updateDisplay(ms){
    const f=fmt(ms);
    document.getElementById('chronoMain').textContent=f.main;
    document.getElementById('chronoMs').textContent=`· ${f.cs} ·`;
  }

  function updateHands(ms){
    const s=ms/1000;
    document.getElementById('secHand').style.transform=`rotate(${(s%60)*6}deg)`;
    document.getElementById('minHand').style.transform=`rotate(${(s/60)*6}deg)`;
    document.getElementById('hrHand').style.transform =`rotate(${(s/3600)*30}deg)`;
  }

  function tick(){
    if(!running) return;
    elapsed=Date.now()-startTime;
    updateHands(elapsed);
    updateDisplay(elapsed);
    rafId=requestAnimationFrame(tick);
  }

  function toggle(){
    const btn=document.getElementById('btnStart');
    if(!running){
      startTime=Date.now()-elapsed;
      running=true;
      btn.classList.add('running');
      btn.textContent='Stop';
      rafId=requestAnimationFrame(tick);
    } else {
      running=false;
      cancelAnimationFrame(rafId);
      btn.classList.remove('running');
      btn.textContent='Start';
    }
  }

  function lap(){
    if(!running && elapsed===0) return;
    laps.unshift({n:laps.length+1, total:elapsed, split:elapsed-lapStart});
    lapStart=elapsed;
    renderLaps();
  }

  function reset(){
    running=false; cancelAnimationFrame(rafId);
    elapsed=0; lapStart=0; laps=[];
    const btn=document.getElementById('btnStart');
    btn.classList.remove('running'); btn.textContent='Start';
    updateHands(0); updateDisplay(0); renderLaps();
  }

  function renderLaps(){
    const list=document.getElementById('lapList'); list.innerHTML='';
    laps.forEach(l=>{
      const f=fmt(l.total), fs=fmt(l.split);
      const d=document.createElement('div'); d.className='lap-item';
      d.innerHTML=`<span class="lap-n">LAP ${pad2(l.n)}</span><span class="lap-t">${f.main}<small style="font-size:0.6rem;color:#888">.${f.cs}</small></span><span class="lap-d">+${fs.main}.${fs.cs}</span>`;
      list.appendChild(d);
    });
  }

  updateHands(0); updateDisplay(0);
</script>
</body>
</html>
