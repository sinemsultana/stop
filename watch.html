<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumière Chrono</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Montserrat:wght@200;300;400&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --gold: #c9a84c;
      --gold-light: #f0d878;
      --gold-dark: #8a6820;
      --green: #1a3a2a;
      --green-mid: #2d5a3d;
      --green-bright: #4a8a5a;
      --green-accent: #5cb87a;
      --black: #080b09;
      --dial: #060d08;
    }

    html, body { width: 100%; height: 100%; background: var(--black); overflow: hidden; }

    body {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh; position: relative;
    }

    body::before {
      content: ''; position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(26,58,42,0.35) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 20% 100%, rgba(201,168,76,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 80% 80%, rgba(26,58,42,0.2) 0%, transparent 60%);
      pointer-events: none;
    }

    body::after {
      content: ''; position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(201,168,76,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,168,76,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .page {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center; gap: 0;
    }

    .header { text-align: center; margin-bottom: 28px; }

    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem; font-weight: 300;
      color: var(--gold-light);
      letter-spacing: 0.35em; text-transform: uppercase; line-height: 1;
    }
    .brand-name span { color: var(--green-accent); }

    .brand-sub {
      font-size: 0.5rem; letter-spacing: 0.55em;
      color: var(--gold-dark); text-transform: uppercase;
      margin-top: 6px; font-weight: 200;
    }

    .divider {
      width: 120px; height: 1px; margin: 10px auto 0;
      background: linear-gradient(90deg, transparent, var(--green-accent), var(--gold), var(--green-accent), transparent);
      opacity: 0.6;
    }

    .watch-wrap {
      position: relative;
      filter:
        drop-shadow(0 0 80px rgba(26,58,42,0.6))
        drop-shadow(0 0 30px rgba(201,168,76,0.15))
        drop-shadow(0 30px 60px rgba(0,0,0,0.9));
    }

    .digital-time {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, 28px);
      text-align: center; z-index: 10; pointer-events: none;
    }

    .digital-ms {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.65rem; font-weight: 200;
      color: var(--green-accent); letter-spacing: 0.2em; opacity: 0.8;
    }

    .controls {
      display: flex; gap: 20px; margin-top: 32px; align-items: center;
    }

    .btn {
      position: relative; width: 56px; height: 56px;
      border-radius: 50%; border: none; cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.5rem; font-weight: 300;
      letter-spacing: 0.15em; text-transform: uppercase;
      transition: all 0.25s ease; overflow: hidden;
    }
    .btn::before {
      content: ''; position: absolute; inset: 0;
      border-radius: 50%; opacity: 0; transition: opacity 0.2s;
    }
    .btn:hover::before { opacity: 1; }
    .btn:active { transform: scale(0.94); }

    .btn-start {
      width: 72px; height: 72px;
      background: radial-gradient(circle at 40% 35%, #4a8a5a, #2d5a3d 60%, #1a3a2a 100%);
      color: var(--gold-light); border: 1.5px solid var(--green-accent);
      box-shadow: 0 0 20px rgba(74,138,90,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
    }
    .btn-start::before {
      background: radial-gradient(circle at 40% 35%, rgba(255,255,255,0.1), transparent);
    }
    .btn-start.running {
      background: radial-gradient(circle at 40% 35%, #8a3a2a, #5a2010 60%, #3a1008 100%);
      border-color: #c06040;
      box-shadow: 0 0 20px rgba(180,80,40,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
      color: #f0c0a0;
    }

    .btn-lap {
      background: radial-gradient(circle at 40% 35%, #2a2a1a, #1a1a0e 60%, #0e0e08 100%);
      color: var(--gold); border: 1px solid var(--gold-dark);
      box-shadow: 0 0 10px rgba(201,168,76,0.15), inset 0 1px 0 rgba(255,255,255,0.05);
    }
    .btn-lap::before {
      background: radial-gradient(circle at 40% 35%, rgba(201,168,76,0.1), transparent);
    }

    .btn-reset {
      background: radial-gradient(circle at 40% 35%, #1a1a2a, #0e0e1a 60%, #080810 100%);
      color: #6080a0; border: 1px solid #303050;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    }
    .btn-reset::before {
      background: radial-gradient(circle at 40% 35%, rgba(100,120,180,0.1), transparent);
    }

    .btn-icon { font-size: 1.1rem; display: block; margin-bottom: 2px; }

    .laps {
      margin-top: 24px; width: 300px;
      max-height: 120px; overflow-y: auto;
      scrollbar-width: thin; scrollbar-color: #2d5a3d transparent;
    }
    .laps::-webkit-scrollbar { width: 3px; }
    .laps::-webkit-scrollbar-thumb { background: #2d5a3d; border-radius: 2px; }

    .lap-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 5px 12px; border-bottom: 1px solid rgba(201,168,76,0.08);
      animation: lapIn 0.3s ease;
    }
    @keyframes lapIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .lap-num { font-size: 0.55rem; letter-spacing: 0.2em; color: #5cb87a; font-weight: 300; }
    .lap-time { font-family: 'Cormorant Garamond',serif; font-size: 0.9rem; color: #c9a84c; font-weight: 300; letter-spacing: 0.1em; }
    .lap-delta { font-size: 0.55rem; color: #506060; letter-spacing: 0.1em; }

    .footer { margin-top: 28px; text-align: center; }
    .footer-text {
      font-size: 0.45rem; letter-spacing: 0.5em; color: #8a6820;
      text-transform: uppercase; opacity: 0.5;
      font-family: 'Cormorant Garamond',serif; font-style: italic;
    }
  </style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="brand-name">Lumi<span>è</span>re</div>
    <div class="brand-sub">Chrono &nbsp;·&nbsp; Maison de Haute Horlogerie</div>
    <div class="divider"></div>
  </div>

  <div class="watch-wrap">
    <svg id="watch" width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="caseGrad" cx="38%" cy="32%" r="68%">
          <stop offset="0%" stop-color="#f0d878"/>
          <stop offset="25%" stop-color="#c9a84c"/>
          <stop offset="65%" stop-color="#8a6820"/>
          <stop offset="100%" stop-color="#5a4010"/>
        </radialGradient>
        <radialGradient id="bezelGrad" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#3a6048"/>
          <stop offset="40%" stop-color="#1e4030"/>
          <stop offset="100%" stop-color="#0a1e14"/>
        </radialGradient>
        <radialGradient id="dialGrad" cx="50%" cy="40%" r="65%">
          <stop offset="0%" stop-color="#0d1a12"/>
          <stop offset="55%" stop-color="#060d08"/>
          <stop offset="100%" stop-color="#020805"/>
        </radialGradient>
        <linearGradient id="handGold" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#f0d878"/>
          <stop offset="50%" stop-color="#c9a84c"/>
          <stop offset="100%" stop-color="#8a6820"/>
        </linearGradient>
        <radialGradient id="dialShine" cx="33%" cy="22%" r="55%">
          <stop offset="0%" stop-color="rgba(74,138,90,0.07)"/>
          <stop offset="60%" stop-color="rgba(255,255,255,0.015)"/>
          <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
        </radialGradient>
        <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f0d878"/>
          <stop offset="100%" stop-color="#7a5a10"/>
        </linearGradient>
        <radialGradient id="subDialGrad" cx="50%" cy="40%" r="60%">
          <stop offset="0%" stop-color="#101e14"/>
          <stop offset="100%" stop-color="#040a06"/>
        </radialGradient>
        <filter id="glow">
          <feGaussianBlur stdDeviation="1.5" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="greenGlow">
          <feGaussianBlur stdDeviation="2" result="b"/>
          <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.8  0 0 0 0 0.4  0 0 0 0.6 0" result="c"/>
          <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="handShadow">
          <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="rgba(0,0,0,0.8)"/>
        </filter>
        <filter id="goldGlow">
          <feGaussianBlur stdDeviation="2" result="b"/>
          <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.9  0 0 0 0 0.7  0 0 0 0 0.2  0 0 0 0.5 0" result="c"/>
          <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- Strap top -->
      <path d="M128,36 Q150,16 172,36 L166,76 Q150,67 134,76 Z" fill="#0a1208" stroke="#c9a84c" stroke-width="0.4"/>
      <path d="M132,38 Q150,20 168,38 L163,70 Q150,62 137,70 Z" fill="#060a05" opacity="0.7"/>
      <line x1="142" y1="52" x2="158" y2="52" stroke="#1a3a2a" stroke-width="1.5" stroke-dasharray="2,3"/>
      <line x1="142" y1="58" x2="158" y2="58" stroke="#1a3a2a" stroke-width="1.5" stroke-dasharray="2,3"/>

      <!-- Strap bottom -->
      <path d="M128,264 Q150,284 172,264 L166,224 Q150,233 134,224 Z" fill="#0a1208" stroke="#c9a84c" stroke-width="0.4"/>
      <path d="M132,262 Q150,280 168,262 L163,230 Q150,238 137,230 Z" fill="#060a05" opacity="0.7"/>
      <line x1="142" y1="248" x2="158" y2="248" stroke="#1a3a2a" stroke-width="1.5" stroke-dasharray="2,3"/>
      <line x1="142" y1="254" x2="158" y2="254" stroke="#1a3a2a" stroke-width="1.5" stroke-dasharray="2,3"/>

      <!-- Case -->
      <circle cx="150" cy="150" r="122" fill="url(#caseGrad)"/>
      <circle cx="150" cy="150" r="122" fill="none" stroke="#f0d878" stroke-width="0.6" opacity="0.35"/>
      <circle cx="150" cy="150" r="120" fill="none" stroke="#5a4010" stroke-width="0.4" opacity="0.6"/>

      <!-- Bezel -->
      <circle cx="150" cy="150" r="113" fill="url(#bezelGrad)"/>
      <g id="bezelTicks"></g>

      <!-- Dial -->
      <circle cx="150" cy="150" r="98" fill="url(#dialGrad)"/>
      <circle cx="150" cy="150" r="98" fill="url(#dialShine)"/>
      <circle cx="150" cy="150" r="98" fill="none" stroke="#2d5a3d" stroke-width="0.5" opacity="0.4"/>
      <circle cx="150" cy="150" r="86" fill="none" stroke="#1a3a2a" stroke-width="0.6" opacity="0.5"/>
      <circle cx="150" cy="150" r="85" fill="none" stroke="#4a8a5a" stroke-width="0.3" opacity="0.25"/>

      <!-- Hour markers -->
      <g id="hourMarkers"></g>
      <!-- Minute markers -->
      <g id="minMarkers"></g>

      <!-- Sub-dial (minutes) at 9 o'clock -->
      <circle cx="100" cy="150" r="22" fill="url(#subDialGrad)"/>
      <circle cx="100" cy="150" r="22" fill="none" stroke="#2d5a3d" stroke-width="0.8" opacity="0.6"/>
      <circle cx="100" cy="150" r="20" fill="none" stroke="#4a8a5a" stroke-width="0.3" opacity="0.3"/>
      <g id="subDialTicks"></g>
      <text x="100" y="136" text-anchor="middle" font-family="Montserrat,sans-serif" font-size="4.5" fill="#4a8a5a" letter-spacing="1.5" opacity="0.7">MIN</text>
      <g id="subMinHand" style="transform-origin:100px 150px">
        <line x1="100" y1="150" x2="100" y2="132" stroke="url(#handGold)" stroke-width="1.2" stroke-linecap="round" filter="url(#handShadow)"/>
        <circle cx="100" cy="150" r="2.5" fill="#c9a84c"/>
      </g>

      <!-- Brand -->
      <text x="150" y="118" text-anchor="middle" font-family="'Cormorant Garamond',Georgia,serif" font-size="10" fill="#c9a84c" letter-spacing="4" opacity="0.95" font-weight="300">LUMIÈRE</text>
      <line x1="128" y1="122" x2="172" y2="122" stroke="url(#handGold)" stroke-width="0.4" opacity="0.4"/>
      <text x="150" y="131" text-anchor="middle" font-family="'Montserrat',sans-serif" font-size="5" fill="#4a8a5a" letter-spacing="3" opacity="0.7" font-weight="200">CHRONO</text>

      <!-- Minute numbers -->
      <g id="minuteNums"></g>

      <!-- Second hand (green) -->
      <g id="secHand" style="transform-origin:150px 150px">
        <line x1="150" y1="165" x2="150" y2="68" stroke="#5cb87a" stroke-width="1" stroke-linecap="round" filter="url(#greenGlow)"/>
        <line x1="150" y1="165" x2="150" y2="178" stroke="#2d5a3d" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
        <polygon points="150,64 148,72 152,72" fill="#7ad090" opacity="0.9"/>
      </g>

      <!-- Minute hand (gold, prominent) -->
      <g id="minHand" style="transform-origin:150px 150px">
        <rect x="148.5" y="68" width="3" height="90" rx="1.5" fill="url(#handGold)" filter="url(#handShadow)"/>
        <polygon points="150,62 147,72 153,72" fill="#f0d878" opacity="0.95"/>
        <rect x="149.2" y="70" width="1.6" height="10" rx="0.8" fill="rgba(255,255,255,0.5)"/>
      </g>

      <!-- Hour hand (gold) -->
      <g id="hrHand" style="transform-origin:150px 150px">
        <rect x="147.5" y="84" width="5" height="72" rx="2.5" fill="url(#handGold)" filter="url(#handShadow)"/>
        <polygon points="150,78 146,88 154,88" fill="#f0d878" opacity="0.9"/>
      </g>

      <!-- Center jewel -->
      <circle cx="150" cy="150" r="6" fill="url(#caseGrad)"/>
      <circle cx="150" cy="150" r="4" fill="#1a3a2a"/>
      <circle cx="150" cy="150" r="2.5" fill="#4a8a5a" opacity="0.8"/>
      <circle cx="150" cy="150" r="1" fill="#7ad090"/>

      <!-- Crown -->
      <rect x="268" y="143" width="14" height="14" rx="3" fill="url(#crownGrad)" stroke="#f0d878" stroke-width="0.5"/>
      <line x1="268" y1="146.5" x2="282" y2="146.5" stroke="#5a4010" stroke-width="0.6"/>
      <line x1="268" y1="149.5" x2="282" y2="149.5" stroke="#5a4010" stroke-width="0.6"/>
      <line x1="268" y1="152.5" x2="282" y2="152.5" stroke="#5a4010" stroke-width="0.6"/>
      <line x1="268" y1="155.5" x2="282" y2="155.5" stroke="#5a4010" stroke-width="0.6"/>

      <!-- Pushers -->
      <rect x="256" y="118" width="10" height="8" rx="2" fill="url(#crownGrad)" stroke="#c9a84c" stroke-width="0.4"/>
      <rect x="256" y="174" width="10" height="8" rx="2" fill="url(#crownGrad)" stroke="#c9a84c" stroke-width="0.4"/>

      <!-- Crystal glare -->
      <ellipse cx="128" cy="112" rx="38" ry="20" fill="rgba(255,255,255,0.025)" transform="rotate(-28,128,112)"/>
    </svg>
    <div class="digital-time">
      <div class="digital-ms" id="msDisplay">00</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-lap" onclick="lap()">
      <span class="btn-icon">◎</span>LAP
    </button>
    <button class="btn btn-start" id="btnStart" onclick="toggle()">
      <span class="btn-icon" id="startIcon">▶</span>
      <span id="startLabel">START</span>
    </button>
    <button class="btn btn-reset" onclick="reset()">
      <span class="btn-icon">↺</span>RESET
    </button>
  </div>

  <div class="laps" id="lapList"></div>

  <div class="footer">
    <div class="footer-text">Maison de Haute Horlogerie &nbsp;·&nbsp; Genève &nbsp;·&nbsp; Est. MMXXV</div>
  </div>

</div>

<script>
  const SVG_NS = "http://www.w3.org/2000/svg";
  const cx = 150, cy = 150;

  function pt(deg, r) {
    const rad = (deg - 90) * Math.PI / 180;
    return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
  }

  // Bezel ticks
  const bezelG = document.getElementById('bezelTicks');
  for (let i = 0; i < 60; i++) {
    const a = i*6, big = i%5===0;
    const [x1,y1]=pt(a,113), [x2,y2]=pt(a,big?104:108);
    const l=document.createElementNS(SVG_NS,'line');
    l.setAttribute('x1',x1); l.setAttribute('y1',y1);
    l.setAttribute('x2',x2); l.setAttribute('y2',y2);
    l.setAttribute('stroke',big?'#c9a84c':'#2d5a3d');
    l.setAttribute('stroke-width',big?'1.5':'0.7');
    l.setAttribute('opacity',big?'0.9':'0.6');
    bezelG.appendChild(l);
  }

  // Sub-dial ticks
  const subG = document.getElementById('subDialTicks');
  for (let i=0; i<12; i++) {
    const a=i*30, dx=100-cx, dy=150-cy;
    const [x1,y1]=pt(a,20), [x2,y2]=pt(a,17);
    const l=document.createElementNS(SVG_NS,'line');
    l.setAttribute('x1',x1+dx); l.setAttribute('y1',y1+dy);
    l.setAttribute('x2',x2+dx); l.setAttribute('y2',y2+dy);
    l.setAttribute('stroke','#4a8a5a'); l.setAttribute('stroke-width','0.7'); l.setAttribute('opacity','0.6');
    subG.appendChild(l);
  }

  // Hour markers
  const hourG = document.getElementById('hourMarkers');
  for (let i=0; i<12; i++) {
    const a=i*30, [bx,by]=pt(a,78);
    if (i===0) {
      const [t1x,t1y]=pt(a-1.5,72),[t2x,t2y]=pt(a+1.5,72),[t3x,t3y]=pt(a,66);
      const tri=document.createElementNS(SVG_NS,'polygon');
      tri.setAttribute('points',`${t1x},${t1y} ${t2x},${t2y} ${t3x},${t3y}`);
      tri.setAttribute('fill','#f0d878'); tri.setAttribute('filter','url(#goldGlow)');
      hourG.appendChild(tri);
    } else if (i%3===0) {
      const r=document.createElementNS(SVG_NS,'rect');
      r.setAttribute('x',bx-3.5); r.setAttribute('y',by-9);
      r.setAttribute('width','7'); r.setAttribute('height','18'); r.setAttribute('rx','1.5');
      r.setAttribute('fill','url(#handGold)'); r.setAttribute('transform',`rotate(${a},${bx},${by})`);
      r.setAttribute('filter','url(#goldGlow)'); hourG.appendChild(r);
    } else {
      const r=document.createElementNS(SVG_NS,'rect');
      r.setAttribute('x',bx-2); r.setAttribute('y',by-7);
      r.setAttribute('width','4'); r.setAttribute('height','14'); r.setAttribute('rx','1');
      r.setAttribute('fill','url(#handGold)'); r.setAttribute('transform',`rotate(${a},${bx},${by})`);
      hourG.appendChild(r);
    }
  }

  // Minute markers
  const minMarkG=document.getElementById('minMarkers');
  for (let i=0; i<60; i++) {
    if (i%5===0) continue;
    const a=i*6, [x1,y1]=pt(a,96), [x2,y2]=pt(a,99);
    const l=document.createElementNS(SVG_NS,'line');
    l.setAttribute('x1',x1); l.setAttribute('y1',y1);
    l.setAttribute('x2',x2); l.setAttribute('y2',y2);
    l.setAttribute('stroke','#2d5a3d'); l.setAttribute('stroke-width','0.7'); l.setAttribute('opacity','0.6');
    minMarkG.appendChild(l);
  }

  // Minute numbers
  const numG=document.getElementById('minuteNums');
  [5,10,15,20,25,30,35,40,45,50,55,60].forEach((n,i)=>{
    const a=(i+1)*30, [tx,ty]=pt(a,66);
    const t=document.createElementNS(SVG_NS,'text');
    t.setAttribute('x',tx); t.setAttribute('y',ty+3.5);
    t.setAttribute('text-anchor','middle');
    t.setAttribute('font-family',"'Montserrat',sans-serif");
    t.setAttribute('font-size',n%15===0?'7.5':'5.5');
    t.setAttribute('fill',n%15===0?'#c9a84c':'#4a8a5a');
    t.setAttribute('opacity',n%15===0?'0.9':'0.55');
    t.setAttribute('font-weight','200');
    t.textContent=n;
    numG.appendChild(t);
  });

  // Stopwatch
  let running=false, startTime=0, elapsed=0, laps=[], lapStart=0, rafId=null;

  function fmt(ms) {
    const s=Math.floor(ms/1000), m=Math.floor(s/60), sec=s%60, cs=Math.floor((ms%1000)/10);
    return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
  }

  function updateHands(ms) {
    const totalSec=ms/1000;
    const sDeg=  (totalSec%60)*6;
    const mDeg=  (totalSec/60)*6;
    const hDeg=  (totalSec/3600)*30;
    const subDeg=((totalSec/60)%30)*12;
    document.getElementById('secHand').style.transform=`rotate(${sDeg}deg)`;
    document.getElementById('minHand').style.transform=`rotate(${mDeg}deg)`;
    document.getElementById('hrHand').style.transform =`rotate(${hDeg}deg)`;
    document.getElementById('subMinHand').style.transform=`rotate(${subDeg}deg)`;
    document.getElementById('msDisplay').textContent=String(Math.floor((ms%1000)/10)).padStart(2,'0');
  }

  function tick() {
    if (!running) return;
    elapsed=Date.now()-startTime;
    updateHands(elapsed);
    rafId=requestAnimationFrame(tick);
  }

  function toggle() {
    if (!running) {
      startTime=Date.now()-elapsed;
      running=true;
      document.getElementById('btnStart').classList.add('running');
      document.getElementById('startIcon').textContent='⏸';
      document.getElementById('startLabel').textContent='STOP';
      rafId=requestAnimationFrame(tick);
    } else {
      running=false; cancelAnimationFrame(rafId);
      document.getElementById('btnStart').classList.remove('running');
      document.getElementById('startIcon').textContent='▶';
      document.getElementById('startLabel').textContent='START';
    }
  }

  function lap() {
    if (!running && elapsed===0) return;
    const split=elapsed-lapStart; lapStart=elapsed;
    laps.unshift({n:laps.length+1, total:elapsed, split});
    renderLaps();
  }

  function reset() {
    running=false; cancelAnimationFrame(rafId);
    elapsed=0; lapStart=0; laps=[];
    document.getElementById('btnStart').classList.remove('running');
    document.getElementById('startIcon').textContent='▶';
    document.getElementById('startLabel').textContent='START';
    updateHands(0); renderLaps();
  }

  function renderLaps() {
    const list=document.getElementById('lapList'); list.innerHTML='';
    laps.forEach(l=>{
      const d=document.createElement('div'); d.className='lap-item';
      d.innerHTML=`<span class="lap-num">LAP ${String(l.n).padStart(2,'0')}</span><span class="lap-time">${fmt(l.total)}</span><span class="lap-delta">+${fmt(l.split)}</span>`;
      list.appendChild(d);
    });
  }

  updateHands(0);
</script>
</body>
</html>
